<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#6b2d08"/>
    </linearGradient>
    <linearGradient id="nodeRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#6b1414"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#3b1680"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f43f5e"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg2)"/>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="720" fill="url(#dots)"/>

  <text x="600" y="48" fill="#e2e8f0" font-size="22" text-anchor="middle" font-weight="700" letter-spacing="1">Multi-Agent Research Assistant - Architecture</text>
  <text x="600" y="70" fill="#6b7280" font-size="13" text-anchor="middle" letter-spacing="2">LangGraph Orchestration  LlamaIndex RAG  Anthropic Claude</text>
  <line x1="200" y1="82" x2="1000" y2="82" stroke="#1e293b" stroke-width="1"/>

  <rect x="490" y="100" width="220" height="54" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="122" fill="#93c5fd" font-size="11" text-anchor="middle" letter-spacing="2" font-weight="600">USER INPUT</text>
  <text x="600" y="142" fill="#e2e8f0" font-size="14" text-anchor="middle">Research Query</text>

  <line x1="600" y1="154" x2="600" y2="185" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="80" y="190" width="1040" height="360" rx="16" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="80" y="190" width="200" height="26" rx="6" fill="#0f172a"/>
  <text x="180" y="208" fill="#475569" font-size="11" text-anchor="middle" letter-spacing="2">LANGGRAPH PIPELINE</text>

  <rect x="460" y="215" width="280" height="90" rx="12" fill="url(#nodeGreen)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="242" fill="#6ee7b7" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1">RETRIEVAL AGENT</text>
  <text x="600" y="262" fill="#a7f3d0" font-size="11" text-anchor="middle">LlamaIndex - VectorStoreIndex</text>
  <text x="600" y="280" fill="#6b7280" font-size="10" text-anchor="middle">Embeds query, Top-k semantic search</text>
  <text x="600" y="296" fill="#6b7280" font-size="10" text-anchor="middle">Returns chunks with text, score, source</text>

  <rect x="100" y="240" width="320" height="110" rx="10" fill="#0a120a" stroke="#14532d" stroke-width="1.5"/>
  <text x="130" y="262" fill="#4ade80" font-size="11" font-weight="700">LlamaIndex Components</text>
  <text x="118" y="282" fill="#6b7280" font-size="10">SimpleDirectoryReader</text>
  <text x="240" y="282" fill="#374151" font-size="10">-&gt;</text>
  <text x="255" y="282" fill="#86efac" font-size="10">VectorStoreIndex</text>
  <text x="118" y="300" fill="#6b7280" font-size="10">HuggingFace Embeddings (BAAI/bge-small-en-v1.5)</text>
  <text x="118" y="318" fill="#6b7280" font-size="10">.txt, .md, .pdf -&gt; Chunked and Indexed</text>

  <line x1="420" y1="275" x2="460" y2="265" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <rect x="460" y="340" width="280" height="80" rx="12" fill="url(#nodeAmber)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="365" fill="#fde68a" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1">REASONING AGENT</text>
  <text x="600" y="385" fill="#fcd34d" font-size="11" text-anchor="middle">Claude LLM - Synthesis prompt</text>
  <text x="600" y="403" fill="#6b7280" font-size="10" text-anchor="middle">Context grounding, Markdown output</text>

  <line x1="600" y1="305" x2="600" y2="340" stroke="#10b981" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="616" y="325" fill="#4b5563" font-size="9">chunks</text>

  <rect x="460" y="460" width="280" height="80" rx="12" fill="url(#nodeRed)" stroke="#f43f5e" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="485" fill="#fca5a5" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1">FACT-CHECK AGENT</text>
  <text x="600" y="505" fill="#fda4af" font-size="11" text-anchor="middle">Hallucination detection, NLI scoring</text>
  <text x="600" y="523" fill="#6b7280" font-size="10" text-anchor="middle">Returns: confidence_score, flagged, issues</text>

  <line x1="600" y1="420" x2="600" y2="460" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="616" y="442" fill="#4b5563" font-size="9">draft answer</text>

  <rect x="790" y="450" width="290" height="110" rx="10" fill="#0d0d1a" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="935" y="473" fill="#a78bfa" font-size="11" text-anchor="middle" font-weight="700">Conditional Routing</text>
  <rect x="810" y="482" width="115" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="867" y="502" fill="#4ade80" font-size="11" text-anchor="middle">score &gt;= 0.60 PASS</text>
  <rect x="943" y="482" width="115" height="30" rx="6" fill="#7f1d1d" stroke="#f43f5e" stroke-width="1"/>
  <text x="1000" y="502" fill="#fca5a5" font-size="11" text-anchor="middle">score &lt; 0.60 FLAG</text>
  <text x="935" y="535" fill="#4b5563" font-size="10" text-anchor="middle">Both routes go to OUTPUT AGENT</text>
  <text x="935" y="551" fill="#4b5563" font-size="10" text-anchor="middle">Flagged answers carry warning annotations</text>

  <line x1="740" y1="500" x2="790" y2="490" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)"/>

  <rect x="460" y="575" width="280" height="60" rx="12" fill="url(#nodePurple)" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="600" fill="#d8b4fe" font-size="12" text-anchor="middle" font-weight="700" letter-spacing="1">OUTPUT AGENT</text>
  <text x="600" y="620" fill="#c4b5fd" font-size="11" text-anchor="middle">Assembles final answer with annotations</text>

  <line x1="600" y1="540" x2="600" y2="575" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="490" y="655" width="220" height="50" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="600" y="676" fill="#c4b5fd" font-size="11" text-anchor="middle">Final Answer (Markdown)</text>
  <text x="600" y="693" fill="#6b7280" font-size="10" text-anchor="middle">Confidence Badge and Source references</text>

  <line x1="600" y1="635" x2="600" y2="655" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <rect x="80" y="655" width="360" height="50" rx="8" fill="#0a0e14" stroke="#1e293b" stroke-width="1"/>
  <circle cx="104" cy="672" r="5" fill="#10b981"/>
  <text x="115" y="676" fill="#6b7280" font-size="10">Retrieval</text>
  <circle cx="175" cy="672" r="5" fill="#f59e0b"/>
  <text x="186" y="676" fill="#6b7280" font-size="10">Reasoning</text>
  <circle cx="256" cy="672" r="5" fill="#f43f5e"/>
  <text x="267" y="676" fill="#6b7280" font-size="10">Fact-Check</text>
  <circle cx="340" cy="672" r="5" fill="#a855f7"/>
  <text x="351" y="676" fill="#6b7280" font-size="10">Output</text>
  <text x="104" y="695" fill="#4b5563" font-size="9">State: ResearchState (TypedDict) flows through all nodes</text>
</svg>
