  <rect x="855" y="272" width="220" height="8" rx="4" fill="#1e293b"/>
  <rect x="855" y="272" width="211" height="8" rx="4" fill="#22c55e"/>
  <text x="1085" y="280" fill="#22c55e" font-size="9" text-anchor="end">96%</text>

  <line x1="840" y1="300" x2="1110" y2="300" stroke="#1e293b" stroke-width="1"/>

  <text x="975" y="328" fill="#22c55e" font-size="22" text-anchor="middle" font-weight="bold">93%</text>
  <text x="975" y="346" fill="#6b7280" font-size="10" text-anchor="middle">avg. confidence</text>

  <text x="975" y="380" fill="#4ade80" font-size="22" text-anchor="middle" font-weight="bold">3/3</text>
  <text x="975" y="398" fill="#6b7280" font-size="10" text-anchor="middle">queries passed</text>

  <text x="975" y="432" fill="#22d3ee" font-size="22" text-anchor="middle" font-weight="bold">14</text>
  <text x="975" y="450" fill="#6b7280" font-size="10" text-anchor="middle">chunks retrieved total</text>

