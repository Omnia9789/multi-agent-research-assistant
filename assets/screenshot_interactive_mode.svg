  <text x="975" y="140" fill="#e2e8f0" font-size="28" text-anchor="middle" font-weight="bold">3</text>
  <text x="975" y="158" fill="#6b7280" font-size="10" text-anchor="middle">queries this session</text>

  <line x1="840" y1="172" x2="1110" y2="172" stroke="#1e293b" stroke-width="1"/>

