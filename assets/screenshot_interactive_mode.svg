  <rect x="855" y="238" width="220" height="8" rx="4" fill="#1e293b"/>
  <rect x="855" y="238" width="207" height="8" rx="4" fill="#22c55e"/>
  <text x="1085" y="246" fill="#22c55e" font-size="9" text-anchor="end">94%</text>

