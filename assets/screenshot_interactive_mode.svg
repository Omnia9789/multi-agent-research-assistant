  <text x="600" y="47" fill="#6b7280" font-size="13" text-anchor="middle">zsh - multi-agent-research-assistant (Interactive Mode)</text>

  <rect x="70" y="80" width="680" height="52" rx="6" fill="#0f1520" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="88" y="100" fill="#22d3ee" font-size="12" font-weight="bold">Multi-Agent Research Assistant</text>
  <text x="88" y="120" fill="#6b7280" font-size="11">LangGraph  LlamaIndex  Anthropic Claude  |  Type 'exit' to quit</text>

  <text x="70" y="155" fill="#6b7280" font-size="11" font-style="italic">--- Session 1 ---</text>

  <text x="70" y="176" fill="#f59e0b" font-size="12" font-weight="bold">Query:</text>
  <text x="130" y="176" fill="#e2e8f0" font-size="12">How does LangGraph handle state management in multi-agent workflows?</text>

  <text x="70" y="198" fill="#6b7280" font-size="10">[RetrieverAgent] Retrieved 5 chunks  |  [ReasoningAgent] Synthesized  |  [FactCheckAgent] PASS 89%</text>

  <text x="70" y="220" fill="#e2e8f0" font-size="12" font-weight="bold">## LangGraph State Management</text>
  <text x="70" y="238" fill="#94a3b8" font-size="11">LangGraph uses a TypedDict-based state object that flows through the graph. Each node receives</text>
  <text x="70" y="254" fill="#94a3b8" font-size="11">the full state and returns an updated copy. State is immutable between nodes, preventing race conditions.</text>
  <text x="70" y="270" fill="#94a3b8" font-size="11">Checkpointers (SQLite, Redis) enable persistence and resumable workflows.</text>

  <text x="70" y="290" fill="#22c55e" font-size="11">Fact-Check: PASS  |  Confidence: 89%</text>

  <line x1="70" y1="304" x2="1130" y2="304" stroke="#1e293b" stroke-width="1"/>

  <text x="70" y="325" fill="#6b7280" font-size="11" font-style="italic">--- Session 2 ---</text>

  <text x="70" y="346" fill="#f59e0b" font-size="12" font-weight="bold">Query:</text>
  <text x="130" y="346" fill="#e2e8f0" font-size="12">What embedding model does this system use for document retrieval?</text>

  <text x="70" y="368" fill="#6b7280" font-size="10">[RetrieverAgent] Retrieved 4 chunks  |  [ReasoningAgent] Synthesized  |  [FactCheckAgent] PASS 94%</text>

  <text x="70" y="390" fill="#e2e8f0" font-size="12" font-weight="bold">## Embedding Model</text>
  <text x="70" y="408" fill="#94a3b8" font-size="11">The system uses BAAI/bge-small-en-v1.5, a lightweight but high-quality embedding model from</text>
  <text x="70" y="424" fill="#94a3b8" font-size="11">HuggingFace. It is loaded locally via the LlamaIndex HuggingFaceEmbedding adapter, requiring no</text>
  <text x="70" y="440" fill="#94a3b8" font-size="11">external API calls for embedding. The index is cached to .index_cache/ after the first build.</text>

  <text x="70" y="460" fill="#22c55e" font-size="11">Fact-Check: PASS  |  Confidence: 94%</text>

  <line x1="70" y1="474" x2="1130" y2="474" stroke="#1e293b" stroke-width="1"/>

  <text x="70" y="495" fill="#6b7280" font-size="11" font-style="italic">--- Session 3 ---</text>

  <text x="70" y="516" fill="#f59e0b" font-size="12" font-weight="bold">Query:</text>
  <text x="130" y="516" fill="#e2e8f0" font-size="12">Explain the confidence scoring thresholds for fact-checking.</text>

  <text x="70" y="538" fill="#6b7280" font-size="10">[RetrieverAgent] Retrieved 5 chunks  |  [ReasoningAgent] Synthesized  |  [FactCheckAgent] PASS 96%</text>

  <text x="70" y="560" fill="#e2e8f0" font-size="12" font-weight="bold">## Confidence Scoring Thresholds</text>
  <text x="82" y="578" fill="#94a3b8" font-size="11">0.85-1.00  High confidence - Answer is well-grounded, PASS verdict, no flag</text>
  <text x="82" y="594" fill="#94a3b8" font-size="11">0.60-0.84  Moderate confidence - Minor gaps, WARN verdict, no flag</text>
  <text x="82" y="610" fill="#94a3b8" font-size="11">0.00-0.59  Low confidence - Unsupported claims detected, FAIL verdict, FLAGGED</text>

  <text x="70" y="630" fill="#22c55e" font-size="11">Fact-Check: PASS  |  Confidence: 96%</text>

  <text x="70" y="654" fill="#f59e0b" font-size="12" font-weight="bold">Query:</text>
  <text x="130" y="654" fill="#4b5563" font-size="12">_</text>

  <rect x="820" y="80" width="310" height="560" rx="8" fill="#0d1420" stroke="#1e293b" stroke-width="1"/>
